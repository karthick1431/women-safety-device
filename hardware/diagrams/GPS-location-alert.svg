<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540"><style>text{font-family:Arial,sans-serif;fill:#10233f}.title{font-size:35px;font-weight:700}.head{font-size:23px;font-weight:700}.small{font-size:17px}.line{stroke:#173b6c;stroke-width:4;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#173b6c"/></marker></defs><rect width="1200" height="540" fill="#f8fafc"/><text x="45" y="55" class="title">GPS Location Alert Sequence</text><text x="45" y="88" class="small">The alert should report only a current, validated fix.</text><rect x="60" y="190" width="220" height="150" rx="18" fill="#fff0d6" stroke="#173b6c" stroke-width="3"/><text x="170" y="245" text-anchor="middle" class="head">GPS receiver</text><text x="170" y="280" text-anchor="middle" class="small">Satellite data</text><text x="170" y="305" text-anchor="middle" class="small">latitude / longitude</text><rect x="360" y="190" width="220" height="150" rx="18" fill="#dff5ed" stroke="#173b6c" stroke-width="3"/><text x="470" y="245" text-anchor="middle" class="head">ESP32</text><text x="470" y="280" text-anchor="middle" class="small">fix validity</text><text x="470" y="305" text-anchor="middle" class="small">timestamp + format</text><rect x="660" y="190" width="220" height="150" rx="18" fill="#ffe5e8" stroke="#173b6c" stroke-width="3"/><text x="770" y="245" text-anchor="middle" class="head">Cellular module</text><text x="770" y="280" text-anchor="middle" class="small">SMS / call</text><text x="770" y="305" text-anchor="middle" class="small">network status</text><rect x="960" y="190" width="180" height="150" rx="18" fill="#e6f3ff" stroke="#173b6c" stroke-width="3"/><text x="1050" y="245" text-anchor="middle" class="head">Contacts</text><text x="1050" y="280" text-anchor="middle" class="small">map link</text><text x="1050" y="305" text-anchor="middle" class="small">alert received</text><path class="line" d="M280 265 H360"/><path class="line" d="M580 265 H660"/><path class="line" d="M880 265 H960"/><text x="600" y="420" text-anchor="middle" class="head">Example payload</text><text x="600" y="460" text-anchor="middle" class="small">SOS: assistance needed. Location: https://maps.google.com/?q=&lt;latitude&gt;,&lt;longitude&gt;</text></svg>