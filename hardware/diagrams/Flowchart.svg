<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1050" viewBox="0 0 900 1050"><style>text{font-family:Arial,sans-serif;fill:#10233f;text-anchor:middle}.box{stroke:#173b6c;stroke-width:3;rx:18}.arrow{stroke:#173b6c;stroke-width:4;fill:none;marker-end:url(#a)}.label{font-size:22px;font-weight:700}.small{font-size:17px}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#173b6c"/></marker></defs><rect width="900" height="1050" fill="#f8fafc"/><text x="450" y="55" font-size="36" font-weight="700">Emergency Alert Flow</text><rect class="box" x="300" y="95" width="300" height="70" fill="#dff5ed"/><text x="450" y="138" class="label">Start and initialize</text><path class="arrow" d="M450 165 V215"/><rect class="box" x="260" y="215" width="380" height="80" fill="#e6f3ff"/><text x="450" y="250" class="label">Read SOS and sensor inputs</text><text x="450" y="276" class="small">AI is optional and cannot block SOS</text><path class="arrow" d="M450 295 V345"/><polygon points="450,345 610,420 450,495 290,420" fill="#fff0d6" stroke="#173b6c" stroke-width="3"/><text x="450" y="414" class="label">SOS pressed?</text><path class="arrow" d="M450 495 V550"/><rect class="box" x="250" y="550" width="400" height="82" fill="#e8e1ff"/><text x="450" y="585" class="label">Read latest valid GPS fix</text><text x="450" y="611" class="small">Never send stale data as current</text><path class="arrow" d="M450 632 V682"/><rect class="box" x="210" y="682" width="480" height="82" fill="#ffe5e8"/><text x="450" y="717" class="label">Send SMS / call through cellular</text><text x="450" y="743" class="small">Include map link only when coordinates are valid</text><path class="arrow" d="M450 764 V814"/><rect class="box" x="300" y="814" width="300" height="70" fill="#dff5ed"/><text x="450" y="857" class="label">Record result and retry safely</text><path class="arrow" d="M300 420 H150 V920 H300"/><text x="190" y="402" class="small">No: continue monitoring</text><rect class="box" x="300" y="920" width="300" height="70" fill="#e6f3ff"/><text x="450" y="963" class="label">Continue monitoring</text></svg>