<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700"><style>text{font-family:Arial,sans-serif;fill:#10233f}.title{font-size:35px;font-weight:700}.label{font-size:22px;font-weight:700}.small{font-size:17px}.board{fill:#dff5ed;stroke:#173b6c;stroke-width:5}.part{fill:#fff;stroke:#173b6c;stroke-width:3;rx:12}.trace{stroke:#c17b00;stroke-width:4;fill:none}</style><rect width="1100" height="700" fill="#f8fafc"/><text x="45" y="55" class="title">PCB Layout Concept</text><text x="45" y="88" class="small">Placement study only. No fabrication files or verified dimensions were supplied.</text><rect class="board" x="250" y="130" width="600" height="470" rx="25"/><text x="470" y="170" class="label">Portable safety device PCB concept</text><rect class="part" x="445" y="245" width="210" height="140"/><text x="550" y="305" text-anchor="middle" class="label">ESP32</text><text x="550" y="335" text-anchor="middle" class="small">central controller</text><rect class="part" x="300" y="205" width="110" height="80"/><text x="355" y="250" text-anchor="middle" class="small">SOS</text><rect class="part" x="690" y="205" width="110" height="80"/><text x="745" y="250" text-anchor="middle" class="small">GPS</text><rect class="part" x="690" y="420" width="110" height="80"/><text x="745" y="465" text-anchor="middle" class="small">GSM</text><rect class="part" x="300" y="420" width="110" height="80"/><text x="355" y="465" text-anchor="middle" class="small">MPU6050</text><rect class="part" x="435" y="475" width="230" height="65"/><text x="550" y="515" text-anchor="middle" class="small">regulated power area</text><path class="trace" d="M410 245 H445 M655 280 H690 M655 350 H745 V420 M410 460 H445 M550 385 V475"/><text x="550" y="650" text-anchor="middle" class="small">Keep cellular power routing short and size it for transmission bursts.</text></svg>