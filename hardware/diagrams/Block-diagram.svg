<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><style>text{font-family:Arial,sans-serif;fill:#10233f} .box{stroke:#173b6c;stroke-width:3;rx:16} .label{font-size:24px;font-weight:700} .small{font-size:17px} .wire{stroke:#173b6c;stroke-width:4;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#173b6c"/></marker></defs><rect width="1200" height="620" fill="#f5f8fc"/><text x="50" y="58" font-size="36" font-weight="700">AI + IoT Women Safety Device | System Block Diagram</text><text x="50" y="88" class="small">Concept documentation based on the supplied brief. Proposed connections require verification.</text><rect class="box" x="60" y="170" width="230" height="230" fill="#e6f3ff"/><text x="90" y="215" class="label">Inputs</text><text x="90" y="260" class="small">Manual SOS button</text><text x="90" y="295" class="small">MPU6050 motion</text><text x="90" y="330" class="small">Optional vibration</text><text x="90" y="365" class="small">Optional audio</text><rect class="box" x="430" y="140" width="330" height="290" fill="#dff5ed"/><text x="490" y="205" class="label">ESP32 Controller</text><text x="480" y="255" class="small">Sensor processing</text><text x="480" y="290" class="small">Manual alert decision</text><text x="480" y="325" class="small">GPS and modem control</text><text x="480" y="360" class="small">AI inference (planned)</text><rect class="box" x="900" y="100" width="230" height="130" fill="#fff0d6"/><text x="965" y="150" class="label">GPS</text><text x="955" y="185" class="small">Valid location fix</text><rect class="box" x="900" y="330" width="230" height="130" fill="#ffe5e8"/><text x="950" y="380" class="label">Cellular</text><text x="943" y="415" class="small">SMS / call alert</text><rect class="box" x="430" y="500" width="330" height="70" fill="#eee9ff"/><text x="505" y="545" class="label">Emergency contacts</text><path class="wire" d="M290 285 H430"/><path class="wire" d="M760 230 H900"/><path class="wire" d="M760 370 H900"/><path class="wire" d="M1015 460 V535 H760"/><text x="315" y="270" class="small">GPIO / I2C</text><text x="790" y="215" class="small">UART</text><text x="790" y="355" class="small">UART</text></svg>